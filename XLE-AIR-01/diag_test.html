<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Diagnostic Test</title>
</head>
<body>

<h2>Variant A — Table only, no heading, no note</h2>
<table>
<thead><tr><th>Col1</th><th>Col2</th></tr></thead>
<tbody><tr><td>1</td><td>2</td></tr></tbody>
</table>

<h2>Sales Transactions</h2>
<table>
<thead><tr><th>Col1</th><th>Col2</th></tr></thead>
<tbody><tr><td>3</td><td>4</td></tr></tbody>
</table>

<h2>Reference Section</h2>
<span class="note"><strong>Table 3</strong> → SomeLabel · Sheet: SomeLabel · 5 rows</span>
<table>
<thead><tr><th>Col1</th><th>Col2</th></tr></thead>
<tbody><tr><td>5</td><td>6</td></tr></tbody>
</table>

<table id="NamedTable" name="NamedTable">
<thead><tr><th>Col1</th><th>Col2</th></tr></thead>
<tbody><tr><td>7</td><td>8</td></tr></tbody>
</table>

</body>
</html>
